[package]
name = "disvoke"
version = "2.0.0"
edition = "2024"
description = "Native Discord message cleaner using the GDPR privacy data pack"
license = "MIT"

[dependencies]
eframe = "0.33"
egui = "0.33"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.17"
directories = "6"
chrono = { version = "0.4", features = ["clock"] }
rand = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"
